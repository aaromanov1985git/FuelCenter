# ═══════════════════════════════════════════════════════════════
#  GSM Converter — надстройка HTTPS над prod-стеком
# ═══════════════════════════════════════════════════════════════
#  Применяется ВМЕСТЕ с docker-compose.prod.yml, не вместо него:
#
#      export COMPOSE_FILE=docker-compose.prod.yml:docker-compose.https.yml
#      docker compose up -d
#
#  Либо явно:
#      docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
#
#  Что меняется относительно prod:
#    - публикуются порты 80 (редирект) и 443 вместо ${FRONTEND_PORT}
#    - поверх default.conf монтируется nginx.frontend.https.conf
#      (пересборка образа не нужна)
#    - монтируется каталог ./certs с сертификатом
#
#  Предварительно: сертификат в ./certs/{fullchain.pem,privkey.pem}
#  Быстрый самоподписанный для проверки:
#      bash migration_backup/linux/make_selfsigned_cert.sh gsm.example.com
#
#  ⚠️  В .env при переходе на HTTPS обязательно:
#        GSM_SCHEME=https
#        COOKIE_SECURE=true   — и в .env, И в backend/.env
#        ALLOWED_ORIGINS с https://<имя>
#      Иначе вход не заработает. Проверяет 00_preflight_check.sh.
# ───────────────────────────────────────────────────────────────
services:
  frontend:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.frontend.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Каталог для HTTP-01 проверки ACME (Let's Encrypt), если понадобится
      - ./certbot-www:/var/www/certbot
