# Nginx внутри prod-контейнера frontend (docker-compose.prod.yml)
# Раздаёт собранный SPA и проксирует /api на backend в docker-сети.
# Всё в одном origin (http://<хост>[:порт]) → CORS не задействуется.
# Конфиг host-agnostic: server_name _, backend адресуется по DNS-имени docker-сети.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # API → backend по DNS-имени docker-сети
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Таймауты для крупных загрузок
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # API ППР по корневому пути (/public-api/v1/...) → backend.
    # Отдельный блок, потому что этот путь не начинается с /api: без него запрос
    # 1С попадал в SPA-fallback ниже и получал HTML вместо JSON, что на стороне
    # 1С выглядит как «отсутствует возможность подключения к функциям API ППР».
    location /public-api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Выгрузка транзакций за большой период отвечает долго
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Статика с длинным кэшем
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
