# Nginx внутри prod-контейнера frontend — вариант с TLS.
# Подключается через docker-compose.https.yml (монтируется поверх default.conf),
# поэтому переход на HTTPS не требует пересборки образа.
#
# Конфиг host-agnostic: server_name _, редирект использует $host. Один и тот же
# файл обслуживает и DNS-имя, и доступ по IP — адрес нигде не прошит.
#
# Сертификаты монтируются в /etc/nginx/certs:
#   fullchain.pem  — сертификат + промежуточные центры
#   privkey.pem    — закрытый ключ
# Заменить файлы и выполнить `docker compose ... exec frontend nginx -s reload`
# достаточно для смены сертификата; конфиг при этом не меняется.

# ── HTTP: только редирект на HTTPS ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Путь для HTTP-01 проверки ACME, если сертификат будет выпускаться Let's Encrypt.
    # Отдаём до редиректа, иначе проверка уйдёт в 301 и не пройдёт.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: собственно приложение ───────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # API → backend по DNS-имени docker-сети
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Backend узнаёт, что исходный запрос был по HTTPS — важно для
        # выставления cookie с флагом Secure при COOKIE_SECURE=true.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Таймауты для крупных загрузок
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Статика с длинным кэшем
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS намеренно не включаем, пока сертификат самоподписанный: браузер
    # запомнит требование HTTPS для имени и откатиться станет сложно.
    # После установки доверенного сертификата раскомментировать:
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
